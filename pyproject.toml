[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot_sommelier_caviste"
version = "1.0.0"
description = "Copilote Métier Autonome : Copilot Sommelier & Accords Vins"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.24.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["copilot_sommelier_caviste*"]
