[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-sommelier-caviste"
version = "1.0.0"
description = "Agent autonome conseillant les accords mets-vins, millésimes et cépages selon le plat choisi par le client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary / SNORBIK AI" }
authors = [
    { name = "Snorbik AI Engineering", email = "engineering@snorbik.ai" }
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "mcp>=1.0.0"
]

[tool.setuptools]
packages = { find = { where = ["."], exclude = ["tests*", "docs*"] } }
